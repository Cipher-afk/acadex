version: '3.8' #Create the version

services: #Create the services you want to run together
  db:
    image: postgres:15
    restart: unless-stopped
    environment: 
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=kudos123
      - POSTGRES_DB=acadex
    volumes: 
      - postgres_data:/var/lib/postgresql/data
  backend: #Build them
    build: 
      context: .
      dockerfile: ./payment_api/Dockerfile #Build the docker file from the path
    restart: unless-stopped
    init: true # reaps Chromium child processes so they don't pile up as zombies
    shm_size: "1gb" # Chromium needs real shared memory or pages crash
    mem_limit: 2g
    ports: #Display the ports
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
  
  bot:
    build: ./
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    mem_limit: 2g
    depends_on: #This means the api has torun first before the bot
      - backend
      - db
    environment:
      - DOMAIN_NAME=http://backend:8000 #Api url
    env_file:
      - .env
volumes:
  postgres_data:
